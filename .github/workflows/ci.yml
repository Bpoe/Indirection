name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            global.json
            dotnet-tools.json
      - run: dotnet restore Indirection.sln
      - run: dotnet build Indirection.sln -c Release --no-restore
      - name: Test admin UI behavior
        run: node --test src/test/admin-ui/app.test.cjs
      - name: Test and enforce line and branch coverage
        run: >-
          dotnet test --project src/test/Indirection.Tests -c Release --no-build
          --coverlet --coverlet-threshold 96 --coverlet-threshold-type line,branch
          --results-directory "${{ github.workspace }}/artifacts/coverage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: artifacts/coverage
          if-no-files-found: error
      - name: Publish portable application
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          dotnet publish src/prod/Indirection -c Release --no-restore
          --self-contained false -p:UseAppHost=false
          -p:DebugType=None -p:DebugSymbols=false -o artifacts/portable
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts/portable
          zip -r "../indirection-${RELEASE_TAG}.zip" .
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-portable
          path: artifacts/indirection-*.zip
          if-no-files-found: error

  docker:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-portable
          path: artifacts
      - name: Extract published application
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: unzip "artifacts/indirection-${RELEASE_TAG}.zip" -d artifacts/portable
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/bpoe/indirection
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [test, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-portable
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          "artifacts/indirection-${RELEASE_TAG}.zip"
          --verify-tag --title "$RELEASE_TAG" --generate-notes
