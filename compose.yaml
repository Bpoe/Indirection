services:
  indirection:
    image: ghcr.io/bpoe/indirection:latest
    ports:
      - "8080:8080"
    volumes:
      - data:/data
      # Optional complete configuration override:
      # - ./appsettings.json:/app/appsettings.json:ro
    restart: unless-stopped

    secrets:
      - source: ApiKey
        target: Authentication__ApiKey

volumes:
  data:

secrets:
  ApiKey:
    environment: INDIRECTION_API_KEY